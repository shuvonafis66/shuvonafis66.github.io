<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Al Nafis Fuad Shuvo — Photography (edit mode)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0f0f0e; --bg-raised:#171716; --line:#2a2a28; --paper:#eee9df; --paper-dim:#9c968a; --clay:#b98a5a; --ok:#7fae7f; --err:#c97a6a; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--bg); color:var(--paper); font-family:'Work Sans',sans-serif; font-weight:300; line-height:1.6; }
  a{ color:inherit; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:400; }

  #lockScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:6vw; }
  .lock-card{ max-width:420px; width:100%; background:var(--bg-raised); border:1px solid var(--line); padding:34px; }
  .lock-card h1{ font-size:1.4rem; margin-bottom:6px; }
  .lock-card p{ color:var(--paper-dim); font-size:.83rem; margin-bottom:22px; }
  .lock-card label{ display:block; font-size:.76rem; color:var(--paper-dim); margin:12px 0 5px; }
  .lock-card label:first-of-type{ margin-top:0; }
  .lock-card input{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--paper); padding:10px 12px; font-family:'Work Sans',sans-serif; font-size:.88rem; border-radius:2px; }
  .lock-card button{ margin-top:20px; width:100%; background:var(--clay); color:#0f0f0e; border:none; padding:11px; font-size:.88rem; font-weight:500; cursor:pointer; border-radius:2px; }
  .lock-msg{ margin-top:12px; font-size:.78rem; color:var(--err); display:none; }

  #appRoot{ display:none; padding:0 6vw 110px; max-width:1000px; margin:0 auto; }
  #appRoot h2{ font-size:1.5rem; margin:5vh 0 3vh; border-top:1px solid var(--line); padding-top:5vh; }
  #appRoot h2:first-of-type{ border:none; padding-top:6vh; }
  .card{ background:var(--bg-raised); border:1px solid var(--line); padding:24px; margin-bottom:2vh; }
  label{ display:block; font-size:.76rem; color:var(--paper-dim); margin:14px 0 5px; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=date], textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--paper); padding:10px 12px; font-family:'Work Sans',sans-serif; font-size:.88rem; border-radius:2px; }
  textarea{ min-height:70px; }
  input[type=file]{ font-size:.82rem; color:var(--paper-dim); margin-top:2px; }
  .row{ display:flex; gap:14px; } .row>div{ flex:1; }
  .btn{ background:none; border:1px solid var(--line); color:var(--paper-dim); padding:9px 16px; border-radius:100px; font-size:.78rem; cursor:pointer; font-family:'Work Sans',sans-serif; }
  .btn.solid{ background:var(--clay); color:#0f0f0e; border:none; font-weight:500; }
  .btn.danger{ border-color:var(--err); color:var(--err); }
  .msg{ font-size:.78rem; margin-top:10px; }
  .msg.ok{ color:var(--ok); } .msg.err{ color:var(--err); }

  .gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:12px; margin-top:2vh; }
  .frame{ position:relative; background:var(--bg); border-radius:5px; overflow:hidden; aspect-ratio:1/1; box-shadow:0 0 0 1px var(--line); }
  .frame img, .frame video{ width:100%; height:100%; object-fit:cover; display:block; }
  .frame .actions{ position:absolute; top:6px; right:6px; display:flex; gap:5px; }
  .frame .actions button{ background:rgba(15,15,14,.85); border-radius:100px; padding:4px 10px; font-size:.68rem; cursor:pointer; border:1px solid; }
  .frame .edit-btn{ color:var(--clay); border-color:var(--clay); }
  .frame .del-btn{ color:var(--err); border-color:var(--err); }
  .frame .label{ position:absolute; left:0; right:0; bottom:0; padding:8px; font-size:.7rem; background:linear-gradient(0deg,rgba(0,0,0,.75),transparent); }

  .inline-form{ display:none; margin-top:2vh; }
  .inline-form.open{ display:block; }

  #editBar{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--bg-raised); border-top:1px solid var(--line); padding:14px 6vw; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  #editBar .status{ font-size:.78rem; color:var(--paper-dim); }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card">
    <h1>Edit mode</h1>
    <p>Enter your repo connection and access token once — saved only in this browser.</p>
    <label>GitHub username / org</label><input type="text" id="lkOwner">
    <label>Repository name</label><input type="text" id="lkRepo">
    <label>Branch</label><input type="text" id="lkBranch" value="main">
    <label>Personal access token</label><input type="text" id="lkToken" placeholder="ghp_...">
    <button id="unlockBtn">Unlock editing</button>
    <div class="lock-msg" id="lockMsg"></div>
  </div>
</div>

<div id="appRoot">
  <h2>Page text</h2>
  <div class="card">
    <label>Hero title</label><input type="text" id="heroTitle">
    <label>Hero subtitle</label><textarea id="heroSub"></textarea>
    <label>About — paragraph 1</label><textarea id="aboutP1"></textarea>
    <label>About — paragraph 2</label><textarea id="aboutP2"></textarea>
    <label>About — paragraph 3</label><textarea id="aboutP3"></textarea>
    <label>Skills / tags (comma separated)</label><input type="text" id="skills">
    <div class="row">
      <div><label>Email</label><input type="text" id="ctEmail"></div>
      <div><label>Instagram handle</label><input type="text" id="ctInstagram"></div>
    </div>
    <label>LinkedIn handle</label><input type="text" id="ctLinkedin">
    <label>Portrait photo</label>
    <div id="portraitPreview" style="width:110px;aspect-ratio:3/4;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;color:var(--paper-dim);font-size:.7rem;text-align:center;">No portrait yet</div>
    <input type="file" id="portraitFile" accept="image/*">
    <button class="btn" id="portraitUploadBtn" style="margin-top:8px;">Upload portrait</button>
    <span class="msg" id="portraitMsg"></span>
    <label style="margin-top:20px;">Other social links</label>
    <div id="extraLinksList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;"></div>
    <button class="btn" id="addExtraLinkBtn">+ Add link</button>
  </div>

  <h2>Photos &amp; videos</h2>
  <div class="card">
    <button class="btn solid" id="addPlaceBtn">+ Add photos / videos</button>
    <div class="inline-form" id="newPlaceForm">
      <label>Place name</label><input type="text" id="npPlace" placeholder="e.g. Salzburg">
      <div class="row">
        <div><label>Date taken</label><input type="date" id="npDate"></div>
        <div><label>Region (optional)</label><input type="text" id="npRegion"></div>
      </div>
      <label>Story / caption</label><textarea id="npStory"></textarea>
      <label>Files (photos or short videos — select several at once)</label>
      <input type="file" id="npFile" accept="image/*,video/*" multiple>
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;">
        <button class="btn solid" id="npSubmit">Upload</button>
        <button class="btn" id="npCancel">Cancel</button>
        <span class="msg" id="npMsg"></span>
      </div>
    </div>
    <div class="inline-form" id="editPhotoForm">
      <label>Place name</label><input type="text" id="epPlace">
      <div class="row">
        <div><label>Date taken</label><input type="date" id="epDate"></div>
        <div><label>Region (optional)</label><input type="text" id="epRegion"></div>
      </div>
      <label>Story / caption</label><textarea id="epStory"></textarea>
      <label>Replace file (optional)</label>
      <input type="file" id="epFile" accept="image/*,video/*">
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;">
        <button class="btn solid" id="epSubmit">Save changes</button>
        <button class="btn" id="epCancel">Cancel</button>
        <span class="msg" id="epMsg"></span>
      </div>
    </div>
    <div id="gallery-root"></div>
  </div>
</div>

<div id="editBar" style="display:none;">
  <span class="status" id="editStatus">Text edits save when you press "Save page text" — photo/video changes save instantly.</span>
  <div style="display:flex;gap:10px;">
    <button class="btn danger" id="disconnectBtn">Disconnect</button>
    <button class="btn solid" id="saveSiteBtn">Save page text</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function getSettings(){
  return {
    owner: localStorage.getItem('gh_owner') || '',
    repo: localStorage.getItem('gh_repo') || '',
    branch: localStorage.getItem('gh_branch') || 'main',
    token: localStorage.getItem('gh_token') || ''
  };
}
$('lkOwner').value = getSettings().owner;
$('lkRepo').value = getSettings().repo;
$('lkBranch').value = getSettings().branch || 'main';
$('lkToken').value = getSettings().token;

$('unlockBtn').addEventListener('click', () => {
  const owner = $('lkOwner').value.trim(), repo = $('lkRepo').value.trim();
  const branch = $('lkBranch').value.trim() || 'main', token = $('lkToken').value.trim();
  if(!owner || !repo || !token){ $('lockMsg').style.display='block'; $('lockMsg').textContent='Fill in owner, repository and token.'; return; }
  localStorage.setItem('gh_owner', owner); localStorage.setItem('gh_repo', repo);
  localStorage.setItem('gh_branch', branch); localStorage.setItem('gh_token', token);
  startApp();
});
$('disconnectBtn').addEventListener('click', () => {
  if(!confirm('Remove the saved token from this browser?')) return;
  ['gh_owner','gh_repo','gh_branch','gh_token'].forEach(k => localStorage.removeItem(k));
  location.reload();
});

function api(path){ const s = getSettings(); return `https://api.github.com/repos/${s.owner}/${s.repo}/contents/${path}`; }
function authHeaders(){ const s = getSettings(); return { 'Authorization':'Bearer '+s.token, 'Accept':'application/vnd.github+json' }; }
async function getFile(path){
  const s = getSettings();
  const res = await fetch(api(path)+`?ref=${s.branch}`, { headers: authHeaders() });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error(`GitHub read error (${path}): ${res.status}`);
  return res.json();
}
async function putFile(path, base64Content, message, sha){
  const s = getSettings();
  const body = { message, content: base64Content, branch: s.branch };
  if(sha) body.sha = sha;
  const res = await fetch(api(path), { method:'PUT', headers:{...authHeaders(),'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(!res.ok){ const t = await res.text(); throw new Error(`GitHub write error (${path}): ${res.status} ${t}`); }
  return res.json();
}
function b64Enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64Dec(str){ return decodeURIComponent(escape(atob(str))); }
async function loadJsonFile(path, fallback){
  const existing = await getFile(path);
  if(!existing) return { data: fallback, sha: null };
  let data = fallback;
  try{ data = JSON.parse(b64Dec(existing.content.replace(/\n/g,''))); }catch(e){}
  return { data, sha: existing.sha };
}
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function fileToBase64Raw(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// One resize pass = one grid-ready thumbnail + one lightbox-ready full version.
function processImage(file, fullDim = 2000, fullQ = 0.85, thumbDim = 900, thumbQ = 0.78){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const draw = (maxDim, q) => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        return c.toDataURL('image/jpeg', q).split(',')[1];
      };
      const full = draw(fullDim, fullQ);
      const thumb = draw(thumbDim, thumbQ);
      URL.revokeObjectURL(url);
      resolve({ full, thumb });
    };
    img.onerror = reject;
    img.src = url;
  });
}

const VIDEO_SAFE_MB = 55;
function compressVideoIfNeeded(file, statusEl){
  if(file.size <= VIDEO_SAFE_MB * 1024 * 1024) return Promise.resolve(file);
  if(!(window.MediaRecorder && HTMLVideoElement.prototype.captureStream)){
    if(statusEl) statusEl.textContent = "This browser can't auto-compress video — try Chrome, or shrink the file first.";
    return Promise.resolve(file);
  }
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.muted = true; video.playsInline = true;
    video.src = URL.createObjectURL(file);
    video.onloadedmetadata = () => {
      const duration = video.duration || 10;
      const targetBits = VIDEO_SAFE_MB * 8 * 1024 * 1024 * 0.85;
      const videoBitsPerSecond = Math.max(500000, Math.floor(targetBits / duration));
      const mimeType = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
      let stream;
      try{ stream = video.captureStream(30); }catch(e){ try{ stream = video.captureStream(); }catch(e2){ resolve(file); return; } }
      let recorder;
      try{ recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond }); }catch(e){ resolve(file); return; }
      const chunks = [];
      recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        URL.revokeObjectURL(video.src);
        const blob = new Blob(chunks, { type: mimeType });
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '') + '.webm', { type: mimeType }));
      };
      recorder.onerror = () => resolve(file);
      video.onended = () => { try{ recorder.stop(); }catch(e){} };
      video.play().then(() => {
        if(statusEl) statusEl.textContent = `Compressing video (~${Math.ceil(duration)}s)…`;
        recorder.start(1000);
      }).catch(() => resolve(file));
    };
    video.onerror = () => resolve(file);
  });
}

let photos = [];
let siteData = {};
let currentSkills = [];
let extraLinks = [];

function fillForm(){
  $('heroTitle').value = siteData.heroTitle || "Frames that hold a little longer than a glance.";
  $('heroSub').value = siteData.heroSub || "Originally from Bangladesh, now studying and shooting in Vienna — I make images out of streets, architecture, and the corners of Austria I find while I'm out there.";
  $('aboutP1').value = siteData.aboutP1 || "I'm Al Nafis Fuad Shuvo, an international student from Bangladesh, currently based in Vienna, Austria.";
  $('aboutP2').value = siteData.aboutP2 || "I'm pursuing an MSc in Digital Economy at WU Wien. Photography is what I do between lectures, commutes, and trips around the country.";
  $('aboutP3').value = siteData.aboutP3 || "Every photo below is tied to the place I took it — this page grows as I go.";
  $('ctEmail').value = siteData.email || "shuvonafis66@gmail.com";
  $('ctInstagram').value = siteData.instagramHandle || "al_nafis_fuad_shuvo";
  $('ctLinkedin').value = siteData.linkedinHandle || "nafisfuadshuvo";
  $('skills').value = (Array.isArray(siteData.skills) && siteData.skills.length ? siteData.skills : ["Street Photography","Architecture","Travel","Austria"]).join(', ');
  if(siteData.portraitImage) $('portraitPreview').innerHTML = `<img src="${siteData.portraitImage}" style="width:100%;height:100%;object-fit:cover;">`;
  extraLinks = Array.isArray(siteData.extraLinks) ? siteData.extraLinks.slice() : [];
  renderExtraLinks();
}
function renderExtraLinks(){
  const box = $('extraLinksList'); box.innerHTML = '';
  extraLinks.forEach((link, i) => {
    const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px;';
    row.innerHTML = `<input type="text" placeholder="Label" value="${link.label||''}" style="flex:1;background:var(--bg);border:1px solid var(--line);color:var(--paper);padding:9px 12px;border-radius:2px;font-size:.85rem;">
                      <input type="text" placeholder="https://..." value="${link.url||''}" style="flex:2;background:var(--bg);border:1px solid var(--line);color:var(--paper);padding:9px 12px;border-radius:2px;font-size:.85rem;">
                      <button class="btn danger">✕</button>`;
    const [a,b,c] = row.children;
    a.addEventListener('input', () => extraLinks[i].label = a.value);
    b.addEventListener('input', () => extraLinks[i].url = b.value);
    c.addEventListener('click', () => { extraLinks.splice(i,1); renderExtraLinks(); });
    box.appendChild(row);
  });
}
$('addExtraLinkBtn').addEventListener('click', () => { extraLinks.push({label:'',url:''}); renderExtraLinks(); });

$('portraitUploadBtn').addEventListener('click', async () => {
  const file = $('portraitFile').files[0];
  if(!file){ $('portraitMsg').className='msg err'; $('portraitMsg').textContent='Choose a photo first.'; return; }
  $('portraitUploadBtn').disabled = true;
  $('portraitMsg').className='msg ok'; $('portraitMsg').textContent='Uploading…';
  try{
    const { full } = await processImage(file, 1400, 0.9, 700, 0.8);
    const path = 'assets/photos/profile.jpg';
    const existing = await getFile(path);
    await putFile(path, full, 'Update portrait', existing ? existing.sha : null);
    siteData.portraitImage = path;
    $('portraitPreview').innerHTML = `<img src="${path}" style="width:100%;height:100%;object-fit:cover;">`;
    $('portraitMsg').textContent = 'Uploaded ✓ — press "Save page text" to publish.';
  }catch(e){ $('portraitMsg').className='msg err'; $('portraitMsg').textContent = e.message; }
  finally{ $('portraitUploadBtn').disabled = false; }
});

$('saveSiteBtn').addEventListener('click', async () => {
  $('editStatus').textContent = 'Saving…';
  try{
    const { sha } = await loadJsonFile('data/site.json', {});
    const payload = {
      heroTitle: $('heroTitle').value.trim(), heroSub: $('heroSub').value.trim(),
      aboutP1: $('aboutP1').value.trim(), aboutP2: $('aboutP2').value.trim(), aboutP3: $('aboutP3').value.trim(),
      skills: $('skills').value.split(',').map(x=>x.trim()).filter(Boolean),
      email: $('ctEmail').value.trim(),
      instagramHandle: $('ctInstagram').value.trim().replace(/^@/,''),
      linkedinHandle: $('ctLinkedin').value.trim(),
      portraitImage: siteData.portraitImage || '',
      extraLinks: extraLinks.filter(l => l.label && l.url)
    };
    await putFile('data/site.json', b64Enc(JSON.stringify(payload, null, 2)), 'Update page text', sha);
    $('editStatus').textContent = 'Saved ✓ — refresh the main site in a minute to see it.';
  }catch(e){ $('editStatus').textContent = e.message; }
});

function groupByPlace(list){
  const groups = {}, order = [];
  list.forEach(p => { if(!groups[p.place]){ groups[p.place]=[]; order.push(p.place); } groups[p.place].push(p); });
  return order.map(place => ({ place, items: groups[place] }));
}
function renderGallery(){
  const root = $('gallery-root'); root.innerHTML = '';
  if(!photos.length){ root.innerHTML = '<p style="color:var(--paper-dim);margin-top:2vh;">No photos yet.</p>'; return; }
  groupByPlace(photos).forEach(g => {
    const h = document.createElement('div');
    h.innerHTML = `<h3 style="margin-top:3vh;font-size:1.1rem;">${g.place}</h3>`;
    root.appendChild(h);
    const gal = document.createElement('div'); gal.className = 'gallery';
    g.items.forEach(p => {
      const frame = document.createElement('div'); frame.className = 'frame';
      const isVideo = p.type === 'video';
      const media = isVideo ? `<video src="${p.video}" muted loop playsinline></video>` : `<img src="${p.thumb||p.image}">`;
      frame.innerHTML = `${media}<div class="actions"><button class="edit-btn">Edit</button><button class="del-btn">Del</button></div><div class="label">${(p.story||'').slice(0,40)}</div>`;
      if(isVideo){
        const v = frame.querySelector('video');
        frame.addEventListener('mouseenter', () => v.play().catch(()=>{}));
        frame.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
      }
      frame.querySelector('.edit-btn').addEventListener('click', () => openEditForm(p));
      frame.querySelector('.del-btn').addEventListener('click', () => deletePhoto(p.id));
      gal.appendChild(frame);
    });
    root.appendChild(gal);
  });
}

$('addPlaceBtn').addEventListener('click', () => {
  $('editPhotoForm').classList.remove('open');
  $('newPlaceForm').classList.add('open');
  $('newPlaceForm').scrollIntoView({behavior:'smooth', block:'center'});
});
$('npCancel').addEventListener('click', () => { $('newPlaceForm').classList.remove('open'); $('npMsg').textContent=''; });

$('npSubmit').addEventListener('click', async () => {
  const place = $('npPlace').value.trim();
  const files = Array.from($('npFile').files);
  if(!place || !files.length){ $('npMsg').className='msg err'; $('npMsg').textContent='Place name and at least one file are required.'; return; }
  $('npSubmit').disabled = true;
  try{
    const newEntries = [];
    for(let i=0;i<files.length;i++){
      const file = files[i];
      const isVideo = file.type.startsWith('video/');
      $('npMsg').className='msg ok'; $('npMsg').textContent = `Uploading ${i+1} of ${files.length}…`;
      const base = `${slug(place)}-${Date.now()}-${i}`;
      const entry = { id:'p'+Date.now()+'-'+i, place, region:$('npRegion').value.trim(), date:$('npDate').value, story:$('npStory').value.trim(), type: isVideo?'video':'photo' };
      if(isVideo){
        const compressed = await compressVideoIfNeeded(file, $('npMsg'));
        const ext = compressed.name.split('.').pop() || 'webm';
        const path = `assets/photos/${base}.${ext}`;
        await putFile(path, await fileToBase64Raw(compressed), `Add video: ${place}`);
        entry.video = path;
      }else{
        const { full, thumb } = await processImage(file);
        const fullPath = `assets/photos/${base}.jpg`;
        const thumbPath = `assets/photos/${base}-thumb.jpg`;
        await putFile(fullPath, full, `Add photo: ${place}`);
        await putFile(thumbPath, thumb, `Add preview: ${place}`);
        entry.image = fullPath; entry.thumb = thumbPath;
      }
      newEntries.push(entry);
    }
    $('npMsg').textContent = 'Saving list…';
    const { data: list, sha } = await loadJsonFile('data/photos.json', []);
    const updated = list.concat(newEntries);
    await putFile('data/photos.json', b64Enc(JSON.stringify(updated, null, 2)), `Add ${newEntries.length} item(s): ${place}`, sha);
    photos = updated;
    $('npMsg').className='msg ok'; $('npMsg').textContent = `Added ${newEntries.length} item(s) ✓`;
    $('npPlace').value=''; $('npRegion').value=''; $('npDate').value=''; $('npStory').value=''; $('npFile').value='';
    setTimeout(() => { $('newPlaceForm').classList.remove('open'); $('npMsg').textContent=''; }, 1200);
    renderGallery();
  }catch(e){ $('npMsg').className='msg err'; $('npMsg').textContent = e.message; }
  finally{ $('npSubmit').disabled = false; }
});

let editingId = null;
function openEditForm(p){
  editingId = p.id;
  $('epPlace').value = p.place || ''; $('epDate').value = p.date || '';
  $('epRegion').value = p.region || ''; $('epStory').value = p.story || ''; $('epFile').value = '';
  $('newPlaceForm').classList.remove('open');
  $('editPhotoForm').classList.add('open');
  $('editPhotoForm').scrollIntoView({behavior:'smooth', block:'center'});
}
$('epCancel').addEventListener('click', () => { $('editPhotoForm').classList.remove('open'); $('epMsg').textContent=''; editingId=null; });

$('epSubmit').addEventListener('click', async () => {
  if(!editingId) return;
  const place = $('epPlace').value.trim();
  if(!place){ $('epMsg').className='msg err'; $('epMsg').textContent='Place name is required.'; return; }
  $('epSubmit').disabled = true;
  $('epMsg').className='msg ok'; $('epMsg').textContent='Saving…';
  try{
    const { data: list, sha } = await loadJsonFile('data/photos.json', []);
    const idx = list.findIndex(x => x.id === editingId);
    if(idx === -1) throw new Error('Not found — refresh and try again.');
    const file = $('epFile').files[0];
    if(file){
      const isVideo = file.type.startsWith('video/');
      const base = `${slug(place)}-${Date.now()}`;
      if(isVideo){
        const compressed = await compressVideoIfNeeded(file, $('epMsg'));
        const ext = compressed.name.split('.').pop() || 'webm';
        const path = `assets/photos/${base}.${ext}`;
        await putFile(path, await fileToBase64Raw(compressed), `Replace video: ${place}`);
        list[idx].type='video'; list[idx].video=path; list[idx].image=undefined; list[idx].thumb=undefined;
      }else{
        const { full, thumb } = await processImage(file);
        const fullPath = `assets/photos/${base}.jpg`, thumbPath = `assets/photos/${base}-thumb.jpg`;
        await putFile(fullPath, full, `Replace photo: ${place}`);
        await putFile(thumbPath, thumb, `Replace preview: ${place}`);
        list[idx].type='photo'; list[idx].image=fullPath; list[idx].thumb=thumbPath; list[idx].video=undefined;
      }
    }
    list[idx].place = place; list[idx].date = $('epDate').value;
    list[idx].region = $('epRegion').value.trim(); list[idx].story = $('epStory').value.trim();
    await putFile('data/photos.json', b64Enc(JSON.stringify(list, null, 2)), `Edit entry: ${place}`, sha);
    photos = list;
    $('epMsg').textContent = 'Saved ✓';
    setTimeout(() => { $('editPhotoForm').classList.remove('open'); $('epMsg').textContent=''; editingId=null; }, 800);
    renderGallery();
  }catch(e){ $('epMsg').className='msg err'; $('epMsg').textContent = e.message; }
  finally{ $('epSubmit').disabled = false; }
});

async function deletePhoto(id){
  if(!confirm('Delete this item from the site?')) return;
  try{
    const { data: list, sha } = await loadJsonFile('data/photos.json', []);
    const updated = list.filter(p => p.id !== id);
    await putFile('data/photos.json', b64Enc(JSON.stringify(updated, null, 2)), `Remove ${id}`, sha);
    photos = updated;
    renderGallery();
  }catch(e){ alert('Could not delete: ' + e.message); }
}

async function startApp(){
  $('lockScreen').style.display = 'none';
  $('appRoot').style.display = 'block';
  $('editBar').style.display = 'flex';
  const site = await loadJsonFile('data/site.json', {});
  siteData = site.data;
  const ph = await loadJsonFile('data/photos.json', []);
  photos = Array.isArray(ph.data) ? ph.data : [];
  fillForm();
  renderGallery();
}

if(getSettings().owner && getSettings().repo && getSettings().token) startApp();
</script>
